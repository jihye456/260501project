<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'KiaSignature', Arial, sans-serif;
        }

        header {
            width: 100%;
            height: 64px;
            background: #fff;
            border-bottom: 1px solid #e4e4e4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        /* 로고 */
        .header-logo a {
            display: flex;
            align-items: center;
        }

        .header-logo svg {
            width: 54px;
            height: 20px;
            fill: #05141f;
        }

        /* 중앙 네비게이션 */
        .header-nav {
            display: flex;
            align-items: center;
            gap: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-nav a {
            text-decoration: none;
            color: #05141f;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 24px;
            right: 24px;
            height: 2px;
            background: #05141f;
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }

        .header-nav a:hover::after {
            transform: scaleX(1);
        }

        /* 우측 유틸리티 */
        .header-utils {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-wrap a {
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #05141f;
        }

        .lang-wrap a.active {
            color: #05141f;
        }

        .lang-wrap a.inactive {
            color: #aaa;
        }

        .lang-divider {
            width: 1px;
            height: 12px;
            background: #ccc;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #05141f;
            stroke-width: 1.8;
        }
    </style>
</head>
<body>

<header>
    <!-- 로고 -->
    <div class="header-logo">
        <a href="#">
            <!-- KIA SVG 로고 -->
            <svg viewBox="0 0 270 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 10 L0 90 L30 90 L30 60 L60 90 L100 90 L60 50 L95 10 L57 10 L30 42 L30 10 Z"/>
                <rect x="115" y="10" width="30" height="80"/>
                <path d="M165 10 L140 90 L170 90 L180 55 L190 90 L220 90 L195 10 Z"/>
            </svg>
        </a>
    </div>

    <!-- 중앙 네비게이션 -->
    <nav class="header-nav">
        <a href="#">Brand</a>
        <a href="#">Design</a>
        <a href="#">Vehicle</a>
        <a href="#">Innovation</a>
        <a href="#">Newsroom</a>
    </nav>

    <!-- 우측 유틸리티 -->
    <div class="header-utils">
        <div class="lang-wrap">
            <a href="#" class="inactive">KR</a>
            <span class="lang-divider"></span>
            <a href="#" class="active">EN</a>
        </div>
        <button class="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <line x1="15.5" y1="15.5" x2="22" y2="22"/>
            </svg>
        </button>
    </div>
</header>

</body>
</html>
